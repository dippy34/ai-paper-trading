# 🔔 The closing bell: an impartial (non-AI) scorekeeper.
# Every weekday after the US market closes, mark each bot's book to market at
# closing prices and record a "close" snapshot on that bot's own branch.
# These closing snapshots are the official daily scores on the dashboard.
name: Scorekeeper (closing bell)

on:
  schedule:
    # All after the 4:00 PM ET close and before midnight ET (EDT until Nov 1, EST after).
    # GitHub often runs scheduled jobs late or skips them under load, so there are
    # backups; a re-run for the same day just overwrites that day's "close" snapshot.
    - cron: "15 21 * * 1-5"   # 5:15 PM EDT / 4:15 PM EST
    - cron: "20 22 * * 1-5"   # 6:20 PM EDT / 5:20 PM EST
    - cron: "40 23 * * 1-5"   # 7:40 PM EDT / 6:40 PM EST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scorekeeper
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bot: [risky, safe]
    steps:
      - uses: actions/checkout@v5

      - name: Switch to the bot's branch
        id: branch
        run: |
          BRANCH="$(python3 -m trader branch --bot ${{ matrix.bot }})"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git fetch --depth=1 origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Branch $BRANCH doesn't exist yet (bot hasn't woken up). Nothing to score."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Closing snapshot
        if: steps.branch.outputs.exists == 'true'
        run: python3 -m trader snapshot --bot ${{ matrix.bot }} --label close --only-trading-day

      - name: Commit and push
        if: steps.branch.outputs.exists == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          git config user.name "scorekeeper[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "bots/${{ matrix.bot }}"
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -q -m "🔔 Closing bell: $(python3 -m trader summary --bot ${{ matrix.bot }})"
          for i in 1 2 3 4; do
            git push origin "HEAD:$BRANCH" && exit 0
            sleep $((5 * i))
            git fetch --depth=20 origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            git rebase "origin/$BRANCH" || { git rebase --abort; exit 1; }
          done
          exit 1
